name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check production foundations
        run: bun run foundation:check
      - name: Check types
        run: bun run type-check
      - name: Test
        run: bun run test
      - name: Build Cloudflare artifact
        run: bun run build:cf
        env:
          LIMINAL_ENVIRONMENT: test
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: test
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_ENVIRONMENT: test
          SENTRY_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source identity
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > .open-next/SOURCE_SHA
      - name: Retain deploy candidate
        uses: actions/upload-artifact@v4
        with:
          name: open-next-${{ github.event.pull_request.head.sha || github.sha }}
          path: .open-next
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
