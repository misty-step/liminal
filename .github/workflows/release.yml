name: Release notes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: release-metadata
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unverified or superseded source
        id: source
        run: python3 scripts/release-current.py
        env:
          GATE_RESULT: ${{ github.event.workflow_run.conclusion }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.source.outputs.current == 'true'
        id: release
      - name: Approve real native CI for the generated PR
        if: steps.release.outputs.prs_created == 'true'
        run: python3 scripts/approve-release-ci.py
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
