name: Deploy app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

# Serialize promotions; a stale run is refused against current master.
concurrency:
  group: liminal-production
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: open-next-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Unpack verified artifact (no application rebuild)
        run: |
          sha256sum --check worker-artifact.sha256
          tar -xzf worker-artifact.tar.gz
      - name: Promote and read back; restore prior stable code on failure
        run: python3 scripts/promotion.py
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Retain promotion and recovery identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ github.event.workflow_run.head_sha }}
          path: promotion-receipt.json
          if-no-files-found: warn
          retention-days: 30
